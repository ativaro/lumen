<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Lumen — agent icon in the Lumen Dark palette -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b293a"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none"
        stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>

  <!-- light beam (Lumen) -->
  <circle cx="64" cy="54" r="34" fill="url(#glow)"/>
  <path d="M64 26 L76 60 L64 92 L52 60 Z" fill="url(#beam)"/>
  <path d="M64 34 L71 59 L64 84 L57 59 Z" fill="#e0f2fe" fill-opacity="0.9"/>

  <!-- base -->
  <rect x="42" y="96" width="44" height="6" rx="3" fill="#38bdf8" fill-opacity="0.6"/>
</svg>
