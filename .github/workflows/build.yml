# Build the Arch/CachyOS package and run shell/python syntax checks.
name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bash syntax
        run: |
          set -e
          while IFS= read -r f; do
            if head -n 1 "$f" | grep -Eq '^#!.*(ba)?sh' || [[ "$f" == *.sh || "$f" == *.install || "$f" == *PKGBUILD ]]; then
              echo "checking $f"
              bash -n "$f"
            fi
          done < <(git ls-files 'bin/*' '*.sh' 'system/*' 'packaging/arch/PKGBUILD' '*.install' | grep -vE '\.py$' | grep -v '\.fish$')

      - name: Python syntax
        run: |
          set -e
          while IFS= read -r f; do
            echo "checking $f"
            python3 -m py_compile "$f"
          done < <(git ls-files '*.py')

      - name: Fish syntax
        run: |
          if command -v fish >/dev/null 2>&1; then fish -n shell/lumen.fish; else echo "fish not installed, skip"; fi

      - name: JSON validity
        run: |
          python3 -c "import json,glob; [json.load(open(f)) for f in glob.glob('**/metadata.json', recursive=True) + glob.glob('**/*.json', recursive=True)]"

      - name: Desktop file validity
        run: |
          if command -v desktop-file-validate >/dev/null 2>&1; then
            for f in $(git ls-files 'data/**/*.desktop'); do desktop-file-validate "$f" || true; done
          fi

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pyqt5 python3-gi python3-pil
      - name: Task, privacy, persistence and injection regressions
        env:
          QT_QPA_PLATFORM: offscreen
          LUMEN_DATA: ${{ runner.temp }}/lumen-state
          XDG_CONFIG_HOME: ${{ runner.temp }}/lumen-config
        run: |
          /usr/bin/python3 -m unittest discover -s files -p test_lumen_os.py -v
          /usr/bin/python3 -m unittest discover -s files -p test_mcp.py -v
          cd files && /usr/bin/python3 -m unittest test_network.NetworkAddressTest -v

  package:
    runs-on: ubuntu-latest
    needs: [lint, native-tests]
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install base-devel
        run: pacman -Syu --noconfirm base-devel git

      - name: Create builder user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers

      - name: Build package
        run: |
          chown -R builder:builder .
          su builder -c 'bash packaging/arch/build-package.sh'

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp packaging/arch/*.pkg.tar.zst out/ 2>/dev/null || true
          cp packaging/arch/.SRCINFO out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: lumen-package
          path: out/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lumen-package
          path: out
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.pkg.tar.zst
          generate_release_notes: true
