[package]
name = "lumen-persona"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license-file = "../../LICENSE"
description = "Lumen's persona (catalogue, profiles, style text): one implementation for desktop and server"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
sha2 = { version = "0.11", default-features = false }

[lints.rust]
unsafe_code = "forbid"
