[package]
name = "lumen-vault-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license-file = "../../LICENSE"
description = "Pre-release, synthetic-data qualification of Lumen's isolated KDBX core"

[dependencies]
keepass = { version = "=0.15.0", default-features = false, features = ["save_kdbx4"] }
rust-argon2 = "3.0"
zeroize = "1.8"
sha2 = "0.11"
tempfile = "3.23"
libc = "0.2"
getrandom = "0.4"

[profile.release]
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[patch.crates-io]
keepass = { path = "vendor/keepass" }

[dev-dependencies]
quick-xml = "=0.42.0"
flate2 = "=1.1.10"
