[package]
name = "lumen-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"
description = "Lumen's control of the OpenCode engine: one implementation for desktop and server"

[dependencies]
# The HTTP stack and runtime at the versions the server locks, so both sides run the same client.
tokio = { version = "=1.54.1", features = ["macros", "process", "time"] }
reqwest = { version = "=0.13.5", default-features = false }
rustix = { version = "=1.1.6", features = ["process"] }
serde = "1"
serde_json = "1"
percent-encoding = "=2.3.2"
base64 = "=0.23.1"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"
